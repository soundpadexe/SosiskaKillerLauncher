[package]
name = "skl"
version = "0.1.1"
edition = "2021"
description = "SosiskaKillerLauncher — native GPU-rendered Minecraft launcher"
publish = false

[[bin]]
name = "SosiskaKillerLauncher"
path = "src/main.rs"

[dependencies]
# GUI (GPU via OpenGL/glow — smaller binary than wgpu, same visual result)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "0.29"

# Async + network
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "io-util", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart"] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Images (wallpapers + blur)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Native file dialog for custom wallpapers
rfd = "0.15"

# Offline UUID (UUID v3 of "OfflinePlayer:<nick>")
md5 = "0.7"

# Installer
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha1_smol = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Offline skins: local Yggdrasil API with signed textures
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Safety Guard byte-signature search
memchr = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep image decoding / blur fast even in debug builds
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"
